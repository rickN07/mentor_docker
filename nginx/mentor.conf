# Nginx runs on the host, outside Docker.
# Bootstrap HTTP configuration; enable HTTPS with Certbot before using admin.
# Ports must match ADMIN_PORT / FRONTEND_PORT / BACKEND_PORT in .env.

server {
    listen 80;
    server_name admin.mentor-tattoo.ru;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

