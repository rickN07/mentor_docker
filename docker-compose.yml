name: mentor

services:
  backend:
    build:
      context: ../mentor_backend
      target: runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the existing PostgreSQL database}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3102}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?Set ADMIN_LOGIN}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-http://localhost:3102}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ../mentor_frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_YANDEX_API: ${NEXT_PUBLIC_YANDEX_API:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BLOG_API_URL: ${BLOG_API_URL:-http://backend:4000/articles}

  admin:
    build:
      context: ../mentor_admin
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:8080"
