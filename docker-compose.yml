name: mentor

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentor_db
      POSTGRES_USER: mentor_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../mentor_backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../mentor_backend
      target: runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://mentor_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}@postgres:5432/mentor_db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3102}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?Set ADMIN_LOGIN}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-http://localhost:3102}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../mentor_frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_YANDEX_API: ${NEXT_PUBLIC_YANDEX_API:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BLOG_API_URL: ${BLOG_API_URL:-http://backend:4000/articles}

  admin:
    build:
      context: ../mentor_admin
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:8080"

volumes:
  postgres_data:
